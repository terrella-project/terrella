  # <<< ollama catalog <<<

  # ── Local agent models: ollama's own Anthropic-format endpoint ──────────
  # An agent harness such as the Claude Agent SDK speaks the Anthropic Messages
  # format, tool calls included. ollama serves that format itself at
  # /v1/messages, so these entries present ollama to LiteLLM as an "anthropic"
  # endpoint: the gateway adds its keys, model lists and ledger, and translates
  # nothing. (The ollama/ entries above are for OpenAI-format clients.)
  # Each names a variant with a 64k context from provision/agent-models.list.
  # local/agent is the name agents ask for; which model serves it can change
  # here without touching them.
  - model_name: local/agent
    litellm_params:
      model: anthropic/ornith-1.5:9b-64k
      api_base: http://127.0.0.1:11434
      api_key: ollama

  # ── neptune: the second serving node (ADR-0010, #99) ────────────────────
  # A pinned name (docs/reference/routing.md): a request for neptune/<model>
  # is served by neptune and by nothing else, so no failover is involved.
  # neptune's ollama listens on the tailnet only, and the gateway reaches it
  # by its tailnet name. Its GPUs are out until their airflow is built, so
  # this is one small model on the CPU: it proves the route and is no use as
  # a fallback. No local/ group points at neptune yet.
  - model_name: neptune/llama3.2:3b
    litellm_params:
      model: ollama/llama3.2:3b
      api_base: http://neptune:11434
