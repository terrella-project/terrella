  #   claude-fable → Fable 5.2, claude-opus → Opus 5.5,
  #   claude-sonnet → Sonnet 5.5, claude-haiku → Haiku 5.5
  # These models answer a request that sets a sampling parameter with a 400,
  # so each entry drops them (see update-litellm-config.sh).
  # Raw provider model IDs below are managed by update-litellm-config.sh.
